      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: apiKey
          in: query
          name: appid
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - lat:
          TYPE: FLOAT
          REQUIRED: true
          LOCATION: query
      - lon:
          TYPE: FLOAT
          REQUIRED: true
          LOCATION: query
      - appid:

          LOCATION: query
      - end:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: map[STRING]ANY
        RETURNVAR: openweather_4_0_current_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Invalid or missing API key (HTTP 401)
      - TYPE: ANY
        STATUS: 404
        WHEN: Not found (HTTP 404)
      - TYPE: ANY
        STATUS: 429

      METHOD: GET
      ENDPOINT: /search/geocode/v6/forward
      HEADERS: {}
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - AccessToken:
          type: apiKey
          in: query
          name: access_token
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - access_token:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - q:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - country:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - types:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - bbox:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - proximity:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - language:

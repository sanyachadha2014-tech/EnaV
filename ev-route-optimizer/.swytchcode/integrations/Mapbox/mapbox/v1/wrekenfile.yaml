          REQUIRED: false
          LOCATION: query
      - autocomplete:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
      - permanent:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: map[STRING]ANY
        RETURNVAR: mapbox_geocode_forward_list
        STATUS: 200
    ERRORS:
      - TYPE: ANY
        STATUS: 401
        WHEN: Unauthorized (HTTP 401)
      - TYPE: ANY
        STATUS: 429
        WHEN: Rate limited (HTTP 429)
    CANONICAL_ID: mapbox.geocode.forward.list

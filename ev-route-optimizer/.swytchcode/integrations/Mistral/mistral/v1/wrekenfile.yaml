    CANONICAL_ID: mistral.agent.delete
  mistral.page.list:
    SUMMARY: List agent entities, cursor-paginated.
    DESC: Retrieve a page of agent entities. Unlike the deprecated `GET /v1/agents`, this endpoint paginates by opaque cursor and honors per-agent sharing, returning only agents the caller is authorized to see.

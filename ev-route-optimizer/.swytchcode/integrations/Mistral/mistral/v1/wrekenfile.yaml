          LOCATION: query
      - search:
          TYPE: STRUCT(agents_api_v1_agents_list_pages_get_v1_agents_pages_1a60d32bParam_search)
          REQUIRED: false
          LOCATION: query
      - id:
          TYPE: STRUCT(agents_api_v1_agents_list_pages_get_v1_agents_pages_1a60d32bParam_id)

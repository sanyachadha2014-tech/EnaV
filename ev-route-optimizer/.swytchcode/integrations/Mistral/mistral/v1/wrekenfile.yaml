VERSION: 2.0.2
DEFAULTS:
  bearer_token: BEARER <TOKEN>
  w_base_url: https://api.mistral.ai
METHODS:
  mistral.model.list:
    SUMMARY: List Models
    DESC: List all models available to the user.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/models
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - provider:
          TYPE: STRUCT(list_models_v1_models_get_get_v1_models_5d8ffaeParam_provider)
          REQUIRED: false
          LOCATION: query
      - model:
          TYPE: STRUCT(list_models_v1_models_get_get_v1_models_5d8ffaeParam_model)
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(ModelList)
        RETURNVAR: mistral_model_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.model.list
  mistral.model.get:
    SUMMARY: Retrieve Model
    DESC: Retrieve information about a model.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/models/{model_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - model_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          EXAMPLE: ft:open-mistral-7b:587a6b29:20240514:7e773925
    RETURNS:
      - RETURNTYPE: STRUCT(retrieve_model_v1_models__model_id__get_get_v1_models_model_id_da168112Response200)
        RETURNVAR: mistral_model_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.model.get
  mistral.model.delete:
    SUMMARY: Delete Model
    DESC: Delete a fine-tuned model.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/models/{model_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - model_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
          EXAMPLE: ft:open-mistral-7b:587a6b29:20240514:7e773925
    RETURNS:
      - RETURNTYPE: STRUCT(DeleteModelOut)
        RETURNVAR: mistral_model_delete
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.model.delete
  mistral.conversation.create:
    SUMMARY: Create a conversation and append entries to it.
    DESC: Create a new conversation, using a base model or an agent and append entries. Completion and tool executions are run and the response is appended to the conversation.Use the returned conversation_id to continue the conversation.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/conversations
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ConversationRequest)
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(ConversationRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ConversationResponse)
        RETURNVAR: mistral_conversation_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.conversation.create
  mistral.conversation.list:
    SUMMARY: List all created conversations.
    DESC: Retrieve a list of conversation entities sorted by creation time.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/conversations
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 100
      - metadata:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: "[]STRUCT(agents_api_v1_conversations_list_get_v1_conversations_eeb28178Response200Item)"
        RETURNVAR: mistral_conversation_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.conversation.list
  mistral.conversation.get:
    SUMMARY: Retrieve a conversation information.
    DESC: Given a conversation_id retrieve a conversation entity with its attributes.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/conversations/{conversation_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(agents_api_v1_conversations_get_get_v1_conversations_conversation_id_a258e726Response200)
        RETURNVAR: mistral_conversation_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.conversation.get
  mistral.conversation.delete:
    SUMMARY: Delete a conversation.
    DESC: Delete a conversation given a conversation_id.
    HTTP:
      METHOD: DELETE
      ENDPOINT: /v1/conversations/{conversation_id}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.conversation.delete
  mistral.conversation.create1:
    SUMMARY: Append new entries to an existing conversation.
    DESC: Run completion on the history of the conversation and the user entries. Return the new created entries.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/conversations/{conversation_id}
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ConversationAppendRequest)
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(ConversationAppendRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ConversationResponse)
        RETURNVAR: mistral_conversation_create1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.conversation.create1
  mistral.history.get:
    SUMMARY: Retrieve all entries in a conversation.
    DESC: Given a conversation_id retrieve all the entries belonging to that conversation. The entries are sorted in the order they were appended, those can be messages, connectors or function_call.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/conversations/{conversation_id}/history
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ConversationHistory)
        RETURNVAR: mistral_history_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.history.get
  mistral.message.get:
    SUMMARY: Retrieve all messages in a conversation.
    DESC: Given a conversation_id retrieve all the messages belonging to that conversation. This is similar to retrieving all entries except we filter the messages only.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/conversations/{conversation_id}/messages
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(ConversationMessages)
        RETURNVAR: mistral_message_get

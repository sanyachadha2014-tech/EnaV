    - name: variant_1
      TYPE: "NULL"
      REQUIRED: false
  ChatCompletionRequest:
    - name: model
      TYPE: STRING
      REQUIRED: true
      comment: ID of the model to use. You can use the [List Available Models](/api/#tag/models/operation/list_models_v1_models_get) API to see all of your available models, or see our [Model overview](/models) for model descriptions.
    - name: temperature
      TYPE: STRUCT(ChatCompletionRequest_temperature)
      REQUIRED: false
      comment: What sampling temperature to use, we recommend between 0.0 and 0.7. Higher values like 0.7 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. We generally recommend altering this or `top_p` but not both. The default value varies depending on the model you are targeting. Call the `/models` endpoint to retrieve the appropriate value.
    - name: top_p
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: 0
      MAXIMUM: 1
      DEFAULT: 1
      comment: Nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. We generally recommend altering this or `temperature` but not both.
    - name: max_tokens
      TYPE: STRUCT(ChatCompletionRequest_max_tokens)
      REQUIRED: false
      comment: The maximum number of tokens to generate in the completion. The token count of your prompt plus `max_tokens` cannot exceed the model's context length.
    - name: stream
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: "Whether to stream back partial progress. If set, tokens will be sent as data-only server-side events as they become available, with the stream terminated by a data: [DONE] message. Otherwise, the server will hold the request open until the timeout or until completion, with the response containing the full result as JSON."
    - name: stop
      TYPE: STRUCT(ChatCompletionRequest_stop)
      REQUIRED: false
      comment: Stop generation if this token is detected. Or if one of these tokens is detected when providing an array
    - name: random_seed
      TYPE: STRUCT(ChatCompletionRequest_random_seed)
      REQUIRED: false
      comment: The seed to use for random sampling. If set, different calls will generate deterministic results.
    - name: metadata
      TYPE: STRUCT(ChatCompletionRequest_metadata)
      REQUIRED: false
    - name: messages
      TYPE: "[]STRUCT(ChatCompletionRequest_messages_Item)"
      REQUIRED: true
      comment: The prompt(s) to generate completions for, encoded as a list of dict with role and content.
    - name: response_format
      TYPE: STRUCT(ResponseFormat)
      REQUIRED: false
    - name: tools
      TYPE: STRUCT(ChatCompletionRequest_tools)
      REQUIRED: false
      comment: A list of tools the model may call. Use this to provide a list of functions the model may generate JSON inputs for.
    - name: tool_choice
      TYPE: STRUCT(ChatCompletionRequest_tool_choice)
      REQUIRED: false
      DEFAULT: auto
      comment: "Controls which (if any) tool is called by the model. `none` means the model will not call any tool and instead generates a message. `auto` means the model can pick between generating a message or calling one or more tools. `any` or `required` means the model must call one or more tools. Specifying a particular tool via `{\"type\": \"function\", \"function\": {\"name\": \"my_function\"}}` forces the model to call that tool."
    - name: presence_penalty
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: -2
      MAXIMUM: 2
      DEFAULT: 0
      comment: The `presence_penalty` determines how much the model penalizes the repetition of words or phrases. A higher presence penalty encourages the model to use a wider variety of words and phrases, making the output more diverse and creative.
    - name: frequency_penalty
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: -2
      MAXIMUM: 2
      DEFAULT: 0
      comment: The `frequency_penalty` penalizes the repetition of words based on their frequency in the generated text. A higher frequency penalty discourages the model from repeating words that have already appeared frequently in the output, promoting diversity and reducing repetition.
    - name: "n"
      TYPE: STRUCT(ChatCompletionRequest_n)
      REQUIRED: false
      comment: Number of completions to return for each request, input tokens are only billed once.
    - name: prediction
      TYPE: STRUCT(Prediction)
      REQUIRED: false
      DEFAULT:
        type: content
        content: ""
      comment: Enable users to specify expected results, optimizing response times by leveraging known or predictable content. This approach is especially effective for updating text documents or code files with minimal changes, reducing latency while maintaining high-quality results.
    - name: parallel_tool_calls
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
      comment: Whether to enable parallel function calling during tool use, when enabled the model can call multiple tools in parallel.
    - name: prompt_mode
      TYPE: STRUCT(ChatCompletionRequest_prompt_mode)
      REQUIRED: false
      comment: Allows toggling between the reasoning mode and no system prompt. When set to `reasoning` the system prompt for reasoning models will be used. **Deprecated for reasoning models - use `reasoning_effort` parameter instead.**
    - name: reasoning_effort
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - high
        - none
      comment: Controls the reasoning effort level for reasoning models. "high" enables comprehensive reasoning traces, "none" disables reasoning effort.
    - name: guardrails
      TYPE: STRUCT(ChatCompletionRequest_guardrails)
      REQUIRED: false
      comment: A list of guardrail configurations to apply to this request. Each guardrail specifies a moderation type, categories with thresholds to evaluate, and an action to take on violation.
    - name: prompt_cache_key
      TYPE: STRUCT(ChatCompletionRequest_prompt_cache_key)
      REQUIRED: false
      comment: A cache key to enable prompt caching. When provided, the API will attempt to reuse previously computed tokens for requests sharing the same prefix (e.g. multi-turn conversations or requests with a similar system prompt). Cached tokens are billed at 10% of the standard input token price.
    - name: safe_prompt
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: Whether to inject a safety prompt before all conversations.

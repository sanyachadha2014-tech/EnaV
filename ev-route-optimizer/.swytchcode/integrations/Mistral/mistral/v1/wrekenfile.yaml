          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(AgentListPage)
        RETURNVAR: mistral_page_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)

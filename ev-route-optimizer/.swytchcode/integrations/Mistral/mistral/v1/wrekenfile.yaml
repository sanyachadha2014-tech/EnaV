      REQUIRED: false
  AgentsCompletionRequest:
    - name: max_tokens
      TYPE: STRUCT(AgentsCompletionRequest_max_tokens)
      REQUIRED: false
      comment: The maximum number of tokens to generate in the completion. The token count of your prompt plus `max_tokens` cannot exceed the model's context length.
    - name: stream
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: false
      comment: "Whether to stream back partial progress. If set, tokens will be sent as data-only server-side events as they become available, with the stream terminated by a data: [DONE] message. Otherwise, the server will hold the request open until the timeout or until completion, with the response containing the full result as JSON."
    - name: stop
      TYPE: STRUCT(AgentsCompletionRequest_stop)
      REQUIRED: false
      comment: Stop generation if this token is detected. Or if one of these tokens is detected when providing an array
    - name: random_seed
      TYPE: STRUCT(AgentsCompletionRequest_random_seed)
      REQUIRED: false
      comment: The seed to use for random sampling. If set, different calls will generate deterministic results.
    - name: metadata
      TYPE: STRUCT(AgentsCompletionRequest_metadata)
      REQUIRED: false
    - name: messages
      TYPE: "[]STRUCT(AgentsCompletionRequest_messages_Item)"
      REQUIRED: true
      comment: The prompt(s) to generate completions for, encoded as a list of dict with role and content.
    - name: response_format
      TYPE: STRUCT(ResponseFormat)
      REQUIRED: false
    - name: tools
      TYPE: STRUCT(AgentsCompletionRequest_tools)
      REQUIRED: false
    - name: tool_choice
      TYPE: STRUCT(AgentsCompletionRequest_tool_choice)
      REQUIRED: false
      DEFAULT: auto
    - name: presence_penalty
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: -2
      MAXIMUM: 2
      DEFAULT: 0
      comment: The `presence_penalty` determines how much the model penalizes the repetition of words or phrases. A higher presence penalty encourages the model to use a wider variety of words and phrases, making the output more diverse and creative.
    - name: frequency_penalty
      TYPE: FLOAT
      REQUIRED: false
      MINIMUM: -2
      MAXIMUM: 2
      DEFAULT: 0
      comment: The `frequency_penalty` penalizes the repetition of words based on their frequency in the generated text. A higher frequency penalty discourages the model from repeating words that have already appeared frequently in the output, promoting diversity and reducing repetition.
    - name: "n"
      TYPE: STRUCT(AgentsCompletionRequest_n)
      REQUIRED: false
      comment: Number of completions to return for each request, input tokens are only billed once.
    - name: prediction
      TYPE: STRUCT(Prediction)
      REQUIRED: false
      DEFAULT:
        type: content
        content: ""
      comment: Enable users to specify expected results, optimizing response times by leveraging known or predictable content. This approach is especially effective for updating text documents or code files with minimal changes, reducing latency while maintaining high-quality results.
    - name: parallel_tool_calls
      TYPE: BOOL
      REQUIRED: false
      DEFAULT: true
    - name: prompt_mode
      TYPE: STRUCT(AgentsCompletionRequest_prompt_mode)
      REQUIRED: false
      comment: Allows toggling between the reasoning mode and no system prompt. When set to `reasoning` the system prompt for reasoning models will be used. **Deprecated for reasoning models - use `reasoning_effort` parameter instead.**
    - name: reasoning_effort
      TYPE: STRING
      REQUIRED: false
      ENUM:
        - high
        - none
      comment: Controls the reasoning effort level for reasoning models. "high" enables comprehensive reasoning traces, "none" disables reasoning effort.
    - name: prompt_cache_key
      TYPE: STRUCT(AgentsCompletionRequest_prompt_cache_key)
      REQUIRED: false
      comment: A cache key to enable prompt caching. When provided, the API will attempt to reuse previously computed tokens for requests sharing the same prefix (e.g. multi-turn conversations or requests with a similar system prompt). Cached tokens are billed at 10% of the standard input token price.
    - name: agent_id
      TYPE: STRING
      REQUIRED: true
      comment: The ID of the agent to use for this completion.

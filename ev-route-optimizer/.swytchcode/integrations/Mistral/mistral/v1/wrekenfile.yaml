  mistral.metric.get:
    SUMMARY: Get Workflow Metrics
    DESC: |-
      Get comprehensive metrics for a specific workflow.

      Args:
          workflow_name: The name of the workflow type to get metrics for
          start_time: Optional start time filter (ISO 8601 format)
          end_time: Optional end time filter (ISO 8601 format)

      Returns:
          WorkflowMetrics: Dictionary containing metrics:
              - execution_count: Total number of executions
              - success_count: Number of successful executions
              - error_count: Number of failed/terminated executions
              - average_latency_ms: Average execution duration in milliseconds
              - retry_rate: Proportion of workflows with retries
              - latency_over_time: Time-series data of execution durations

      Example:
          GET /v1/workflows/MyWorkflow/metrics
          GET /v1/workflows/MyWorkflow/metrics?start_time=2025-01-01T00:00:00Z
          GET /v1/workflows/MyWorkflow/metrics?start_time=2025-01-01T00:00:00Z&end_time=2025-12-31T23:59:59Z
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/workflows/{workflow_name}/metrics
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - workflow_name:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - start_time:
          TYPE: STRUCT(get_workflow_metrics_v1_workflows__workflow_name__metrics_get_get_v1_workflows_workflow_name_metrics_8b758a40Param_start_time)
          REQUIRED: false
          LOCATION: query
      - end_time:
          TYPE: STRUCT(get_workflow_metrics_v1_workflows__workflow_name__metrics_get_get_v1_workflows_workflow_name_metrics_8b758a40Param_end_time)
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(WorkflowMetrics)
        RETURNVAR: mistral_metric_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.metric.get

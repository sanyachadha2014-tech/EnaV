      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(AgentUpdateRequest)
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - agent_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(AgentUpdateRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Agent)
        RETURNVAR: mistral_agent_update
        STATUS: 200
    ERRORS:

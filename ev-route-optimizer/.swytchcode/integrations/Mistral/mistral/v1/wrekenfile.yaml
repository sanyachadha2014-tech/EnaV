    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.message.get
  mistral.restart.create:
    SUMMARY: Restart a conversation starting from a given entry.
    DESC: Given a conversation_id and an id, recreate a conversation from this point and run completion. A new conversation is returned with the new entries returned.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/conversations/{conversation_id}/restart
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(ConversationRestartRequest)
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - conversation_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - body:
          TYPE: STRUCT(ConversationRestartRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(ConversationResponse)
        RETURNVAR: mistral_restart_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.restart.create
  mistral.agent.create:
    SUMMARY: Create a agent that can be used within a conversation.
    DESC: Create a new agent giving it instructions, tools, description. The agent is then available to be used as a regular assistant in a conversation or as part of an agent pool from which it can be used.
    HTTP:
      METHOD: POST
      ENDPOINT: /v1/agents
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
      BODY:
        TYPE: STRUCT(AgentCreationRequest)
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - body:
          TYPE: STRUCT(AgentCreationRequest)
          REQUIRED: true
          LOCATION: body
          CONTENT_TYPE: application/json
    RETURNS:
      - RETURNTYPE: STRUCT(Agent)
        RETURNVAR: mistral_agent_create
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.agent.create
  mistral.agent.list:
    SUMMARY: List agent entities.
    DESC: "Retrieve a list of agent entities sorted by creation time. Deprecated: some features such as agent sharing are not supported by this endpoint. Use the cursor-paginated `GET /v1/agents/pages` instead."

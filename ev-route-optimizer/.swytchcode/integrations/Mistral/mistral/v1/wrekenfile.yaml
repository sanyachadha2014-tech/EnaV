        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.version.update
  mistral.version.get:
    SUMMARY: List all versions of an agent.
    DESC: Retrieve all versions for a specific agent with full agent context. Supports pagination.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/agents/{agent_id}/versions
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - agent_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - page:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 0
          MINIMUM: 0
      - page_size:
          TYPE: INT
          REQUIRED: false
          LOCATION: query
          DEFAULT: 20
          MINIMUM: 1
          MAXIMUM: 100
    RETURNS:
      - RETURNTYPE: "[]STRUCT(Agent)"
        RETURNVAR: mistral_version_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.version.get
  mistral.version.get1:

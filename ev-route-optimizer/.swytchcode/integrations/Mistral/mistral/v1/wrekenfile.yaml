          REQUIRED: false
          LOCATION: query
      - sources:
          TYPE: STRUCT(agents_api_v1_agents_list_get_v1_agents_e94b07ccParam_sources)
          REQUIRED: false
          LOCATION: query
      - name:
          TYPE: STRUCT(agents_api_v1_agents_list_get_v1_agents_e94b07ccParam_name)
          REQUIRED: false
          LOCATION: query
      - search:
          TYPE: STRUCT(agents_api_v1_agents_list_get_v1_agents_e94b07ccParam_search)
          REQUIRED: false
          LOCATION: query
      - id:
          TYPE: STRUCT(agents_api_v1_agents_list_get_v1_agents_e94b07ccParam_id)
          REQUIRED: false
          LOCATION: query
      - metadata:
          TYPE: STRING
          REQUIRED: false
          LOCATION: query
    RETURNS:
      - RETURNTYPE: "[]STRUCT(Agent)"
        RETURNVAR: mistral_agent_list
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.agent.list
  mistral.agent.get:
    SUMMARY: Retrieve an agent entity.
    DESC: Given an agent, retrieve an agent entity with its attributes. The agent_version parameter can be an integer version number or a string alias.

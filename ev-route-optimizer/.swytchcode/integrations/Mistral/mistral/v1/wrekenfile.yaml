    DESC: Get a specific agent version by version number.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/agents/{agent_id}/versions/{version}
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - agent_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - version:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: STRUCT(Agent)
        RETURNVAR: mistral_version_get1
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.version.get1
  mistral.alias.update:
    SUMMARY: Create or update an agent version alias.
    DESC: Create a new alias or update an existing alias to point to a specific version. Aliases are unique per agent and can be reassigned to different versions.
    HTTP:
      METHOD: PUT
      ENDPOINT: /v1/agents/{agent_id}/aliases
      HEADERS:
        Content-Type: application/json
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - agent_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
      - alias:
          TYPE: STRING
          REQUIRED: true
          LOCATION: query
          MIN_LENGTH: 1
          MAX_LENGTH: 64
          PATTERN: ^[a-z]([a-z0-9_-]*[a-z0-9])?$
      - version:
          TYPE: INT
          REQUIRED: true
          LOCATION: query
    RETURNS:
      - RETURNTYPE: STRUCT(AgentAliasResponse)
        RETURNVAR: mistral_alias_update
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.alias.update
  mistral.alias.get:
    SUMMARY: List all aliases for an agent.
    DESC: Retrieve all version aliases for a specific agent.
    HTTP:
      METHOD: GET
      ENDPOINT: /v1/agents/{agent_id}/aliases
      HEADERS:
        Authorization: bearer_token
      CONTENT_TYPE: application/json
      ACCEPT: application/json
    SECURITY:
      - ApiKey:
          type: http
          scheme: bearer
    EXECUTION:
      KIND: http
      MODE: sync
    INPUTS:
      - agent_id:
          TYPE: STRING
          REQUIRED: true
          LOCATION: path
    RETURNS:
      - RETURNTYPE: "[]STRUCT(AgentAliasResponse)"
        RETURNVAR: mistral_alias_get
        STATUS: 200
    ERRORS:
      - TYPE: STRUCT(HTTPValidationError)
        STATUS: 422
        WHEN: Validation Error (HTTP 422)
    CANONICAL_ID: mistral.alias.get
  mistral.alias.delete:
